services:
  - type: web
    name: multi-modal-rag-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: ./start-backend.sh
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: multi-modal-rag-frontend
    runtime: python
    buildCommand: ./build.sh
    startCommand: ./start-frontend.sh
    envVars:
      - key: OPENAI_API_KEY
        sync: false
